; Minimal override set reconstructed from the final stable test.
; Merge these keys into the OptiScaler.ini generated by your installed version.
; Do not replace a newer complete INI with this small example.

[Upscalers]
Dx12Upscaler=dlss

[FrameGen]
Enabled=false
FGInput=nofg
FGOutput=nofg

[Menu]
ShortcutKey=0x22
ShowFps=true
FpsCycleShortcutKey=-1

[Plugins]
LoadAsiPlugins=true

[Hotfix]
DisableOverlays=true

[DlssNr]
Enabled=true
AutoCapture=false
