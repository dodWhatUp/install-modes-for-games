<text x="58" y="1021" font-size="14" font-weight="500" fill="#172033">Direct chords are single simultaneous key combinations. Mouse outputs retain the game&#x27;s configured LMB / MMB / RMB inputs.</text>
<text x="58" y="1045" font-size="14" font-weight="500" fill="#172033">Ctrl also toggles the skill bar in the saved game config. Ability names are generic slots; no class-specific assignments are needed.</text>
