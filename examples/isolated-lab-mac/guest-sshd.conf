Port 2222
ListenAddress 0.0.0.0
HostKey /etc/ssh/isolatedlab_host_ed25519
PidFile /run/isolatedlab-sshd.pid
AllowUsers lab
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes
AuthorizedKeysFile /home/lab/.local/state/isolatedlab-mac/bridge-authorized-keys
StrictModes yes
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
PermitTTY no
ForceCommand /home/lab/agent/venv/bin/python /home/lab/agent/guest_bridge.py
UsePAM yes
