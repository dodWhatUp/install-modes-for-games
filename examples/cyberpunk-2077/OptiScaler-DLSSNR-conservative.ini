; Minimal configuration delta for Cyberpunk 2077 2.31 with an RTX 50 GPU.
; Merge these keys into the OptiScaler-DLSSNR INI matching the installed build.
; Do not replace a newer release's complete configuration with this excerpt.

[Upscalers]
Dx12Upscaler=dlss

[FrameGen]
External=true
Enabled=false
FGInput=nofg
FGOutput=nofg
FGNvngxReplacement=None

[ProcessFilter]
TargetProcessName=Cyberpunk2077.exe

[Menu]
ShortcutKey=0x2e

[DlssNr]
; F8/F9/F11/F12 require the local extended-controls build.
ToggleKey=0x79
PresetCycleKey=0x7a
CompactMenuKey=0x7b
ScaleCycleKey=0x78
PlacementToggleKey=0x77
Precision=0
Enabled=true
RunBeforeSR=true
FinishedPicture=false
DeferredDLSS=false
ResidualAcrossRR=false
ResidualFG=false
Passes=1
WorkingScale=1.0
AutoCapture=false

[Log]
LogToFile=true
LogLevel=2
